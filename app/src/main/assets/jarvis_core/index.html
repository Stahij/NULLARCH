<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body,#canvas-container{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}#canvas-container{position:absolute;inset:0}</style><script src="three.min.local.js"></script><script src="atomicCore.js"></script><script src="plasmaCore.js"></script></head><body><div id="canvas-container"></div><script>
(function(){'use strict';let scene,camera,renderer,clock,active=null,cores={},theme='atomic',quality='auto',state='idle',paused=false,disposed=false,raf=0,fps=60,frames=0,last=0,eco=false,stable=0,renderCount=0,dpr=1,appliedQuality='';const host=document.getElementById('canvas-container'),speeds={idle:1,listening:1.35,processing:1.8,speaking:1.55};
function q(){return quality!=='auto'?quality:(eco?'low':(fps<43?'medium':'high'));}
function buildRenderer(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(52,1,.1,100);camera.position.z=4.7;renderer=new THREE.WebGLRenderer({antialias:false,alpha:true,powerPreference:'low-power',stencil:false});dpr=Math.min(window.devicePixelRatio||1,1.25);renderer.setPixelRatio(dpr);renderer.setClearColor(0,0);host.appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0xffffff,.82));const l=new THREE.PointLight(0x00cfff,2,12);l.position.set(2,2,3);scene.add(l);clock=new THREE.Clock(false);resize();}
function make(t){return t==='plasma'?new PlasmaCore(scene,q()):new AtomicCore(scene,q());}
function clearCores(){Object.keys(cores).forEach(k=>{if(cores[k])cores[k].dispose();});cores={};active=null;}
function rebuild(){clearCores();active=make(theme);cores[theme]=active;active.setVisibility(true);appliedQuality=q();}
function setTheme(t){if(t!=='atomic'&&t!=='plasma'||t===theme&&active)return;if(active)active.setVisibility(false);theme=t;if(!cores[t])cores[t]=make(t);active=cores[t];active.setVisibility(true);}
function setQuality(v){if(!['auto','low','medium','high'].includes(v)||v===quality)return;quality=v;eco=false;stable=0;clearCores();rebuild();}
function resize(){if(!renderer||!camera)return;const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);}
function setEco(v){if(eco===v)return;eco=v;if(quality==='auto')rebuild();renderer.setPixelRatio(v?Math.min(dpr,.8):dpr);renderCount=0;}
function tick(){if(paused||disposed)return;raf=requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;if(active)active.update(dt,t,state,speeds[state]||1);if(!eco||(++renderCount%2===0))renderer.render(scene,camera);frames++;const now=performance.now();if(now-last>=2000){fps=Math.round(frames*1000/(now-last));frames=0;last=now;if(quality==='auto'&&(stable+=2)>=6){if(fps<27&&!eco)setEco(true);else if(fps>48&&eco)setEco(false);else if(q()!==appliedQuality)rebuild();stable=0;}}}
function start(){if(raf||paused||disposed)return;clock.start();last=performance.now();frames=0;raf=requestAnimationFrame(tick);}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}if(clock)clock.stop();}
function lost(e){e.preventDefault();paused=true;stop();}
function restored(){if(disposed)return;clearCores();rebuild();paused=false;start();}
function dispose(){if(disposed)return;disposed=true;stop();window.removeEventListener('resize',resize);if(renderer){renderer.domElement.removeEventListener('webglcontextlost',lost);renderer.domElement.removeEventListener('webglcontextrestored',restored);}clearCores();if(renderer){renderer.dispose();renderer.forceContextLoss();if(renderer.domElement.parentNode)renderer.domElement.parentNode.removeChild(renderer.domElement);renderer=null;}}
window.JarvisCoreAPI={setTheme,setQuality,setState:s=>{if(speeds[s])state=s;},pause:()=>{if(!disposed){paused=true;stop();}},resume:()=>{if(!disposed&&paused){paused=false;start();}},dispose,getStats:()=>({fps,quality:q(),eco})};
try{buildRenderer();renderer.domElement.addEventListener('webglcontextlost',lost,false);renderer.domElement.addEventListener('webglcontextrestored',restored,false);window.addEventListener('resize',resize,{passive:true});active=make(theme);cores[theme]=active;start();window.JarvisCoreReady=true;}catch(e){window.JarvisCoreError=String(e);}
})();</script></body></html>
